name: Flutter

on:
  push:
    paths:
      - "apps/mobile_flutter/**"
  pull_request:
    paths:
      - "apps/mobile_flutter/**"

defaults:
  run:
    working-directory: apps/mobile_flutter

jobs:
  analyze-test-build-web:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: proxim-web-build
          path: apps/mobile_flutter/build/web
          if-no-files-found: error

  build-apk-debug:
    name: Build debug APK
    # Debug APK only; release signing config comes in a later phase.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxim-debug-apk
          path: apps/mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
