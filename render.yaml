services:
  # ---------------------------------------------------------------------------
  # 1. PayIT Backend API Web Service
  # Public HTTPS URL receives live Nuvion webhooks at /webhooks/nuvion
  # ---------------------------------------------------------------------------
  - type: web
    name: payit-backend
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --prod=false && pnpm --filter "payit-backend..." build && node -e "require('fs').accessSync('apps/backend/dist/server.js')"
    startCommand: pnpm --filter @payit/db migrate && pnpm --filter payit-backend start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NUVION_API_KEY
        sync: false
      - key: NUVION_API_BASE_URL
        value: https://api.nuvion.co
      - key: NUVION_PUBLIC_KEY
        sync: false
      - key: NUVION_WEBHOOK_SECRET
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: KMS_MASTER_SECRET
        sync: false
      - key: NEAR_NETWORK_ID
        value: mainnet
      - key: NEAR_RELAYER_ACCOUNT_ID
        sync: false
      - key: NEAR_RELAYER_PRIVATE_KEY
        sync: false
      - key: PROXIM_TREASURY_WALLET
        sync: false
      - key: EASEID_APP_ID
        sync: false
      - key: EASEID_API_KEY
        sync: false
      - key: EASEID_BASE_URL
        value: https://open-api.easeid.ai
      - key: BRAILS_API_KEY
        sync: false
      - key: BRAILS_API_BASE_URL
        value: https://api.brails.com/v1
      - key: BRAILS_WEBHOOK_SECRET
        sync: false
      - key: BACKEND_PUBLIC_URL
        value: https://payit-backend-td53.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_MINI_APP_URL
        value: https://payit-mobile-web.onrender.com
      # Configure this exact URL in Brails:
      # https://payit-backend-td53.onrender.com/webhooks/brails

  # ---------------------------------------------------------------------------
  # 2. PayIT Mobile Web Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: payit-mobile-web
    env: static
    buildCommand: pnpm install --no-frozen-lockfile --prod=false && pnpm -r build
    staticPublishPath: ./apps/mobile-web/dist

    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: payit-backend
          property: host
      - key: VITE_PRIVY_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------------------
  # 3. PayIT Telegram Bot Worker
  # ---------------------------------------------------------------------------
  - type: worker
    name: payit-telegram-bot
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --prod=false && pnpm --filter "payit-telegram-bot..." build
    startCommand: pnpm --filter payit-telegram-bot poll
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PAYIT_BACKEND_URL
        value: https://payit-backend-td53.onrender.com
      - key: TELEGRAM_MINI_APP_URL
        value: https://payit-mobile-web.onrender.com

  # ---------------------------------------------------------------------------
  # 4. PayIT Marketing Landing Website
  # ---------------------------------------------------------------------------
  - type: web
    name: payit-website
    env: static
    buildCommand: pnpm install --no-frozen-lockfile --prod=false && pnpm --filter payit-website build
    staticPublishPath: ./apps/website/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: payit-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------------------
  # 5. PayIT Flutter Web App
  # ---------------------------------------------------------------------------
  - type: web
    name: payit-flutter-web
    env: static
    rootDir: apps/mobile_flutter
    buildCommand: git clone https://github.com/flutter/flutter.git -b stable --depth 1 && export PATH="$PWD/flutter/bin:$PATH" && flutter pub get && flutter build web --release --dart-define=API_URL=https://payit-backend-td53.onrender.com
    staticPublishPath: ./build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

